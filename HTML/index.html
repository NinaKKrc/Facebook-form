<!DOCTYPE html>
<html>
<head>
	<title>Facebook</title>
	<link rel="icon" type="image/png" href="logo.png">
	<link rel="stylesheet" href="../CSS/styles.css">
	<script src="../JavaScript/script.js"></script>
</head>
<body>
	<div class="vse">
		
		<div class="levi">
			<div class="prvi">
				<img src="../Slike/logo.png" alt="logo" class="logo" onclick="prikaziCredits()" style="cursor: pointer;">
				<h1 class="levoBesedil">Explore the things <span style="color:#3162d8;">you love</span>.</h1>
			</div>
			<div class="drugi">
				<img src="../Slike/slika1.png" alt="slika1"  class="slika1">
			</div>
		</div>

		<div class="desni">
			<h2>Log in to Facebook</h2>
			<div class="polje">
				<input type="text" name="email" id="uporabniskoIme" class="mail" placeholder="Email address or mobile number" required>
			</div>
			<div class="polje">
				<input type="password" name="geslo" id="geslo" placeholder="Password" minlength="8" maxlength="30" required>
			</div>
			<button type="button" class="b1" id="loginBtn">Log in</button>
			<div id="toast">Submit successfully!</div>
			<button id="forgot-password" class="b2">Forgot password?</button>
			<button id="create-account" class="b3">Create new account</button>
			<div class="metaPolje">
				<img src="../Slike/meta.png" alt="meta" class="meta">
			</div>
		</div>
	
	</div>
</body>
</html>
