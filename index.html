<!DOCTYPE html>
<html>
<head>
	<title>Facebook</title>
	<link rel="stylesheet" href="styles.css">
	<script src="script.js"></script>
</head>
<body>
	<div class="vse">
		
		<div class="levi">
			<img src="logo.png" alt="logo" class="logo">
			<img src="slika1.png" alt="slika1"  class="slika1">
			<h1 class="levoBesedil">Explore the things <span style="color:#3162d8;">you love</span>.</h1>
		</div>

		<div class="desni">
			<h2>Log in to Facebook</h2>
			<div class="polje">
				<input type="text" name="email" class="mail" placeholder="Email address or mobile number" required>
			</div>
			<div class="polje">
				<p>Password</p>
				<input type="password" name="geslo" placeholder="Password" required>
			</div>
			<button type="submit" class="b1">Log in</button>
			<button id="forgot-password" class="b2">Forgot password?</button>
			<button id="create-account" class="b3">Create new account</button>
			<div class="metaPolje">
				<img src="meta.png" alt="meta" class="meta">
			</div>
		</div>
	
	</div>
</body>
</html>
